name: Aetheris quality gate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline contract tests
        run: npm test
        env:
          AETHERIS_NETWORK_MODE: local-only

      - name: Build production bundle
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Report meaningful line count
        run: npm run lines
